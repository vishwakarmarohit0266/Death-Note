<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Death Note | Shinigami Realm</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:wght@400;700&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>

:root{
    --blood:#8b0000;
    --bloodGlow:#ff1a1a;
    --paper:#d8ccb4;
    --ink:#111;
    --gold:#c89b2c;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,#1a1a1a 0%,#050505 60%,#000 100%);
    font-family:'Crimson Text', serif;
    perspective:3000px;
    cursor:crosshair;
}

/* ================= BACKGROUND ================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.015) 0px,
            rgba(255,255,255,.015) 1px,
            transparent 1px,
            transparent 3px
        );
    animation:noise .25s infinite;
    pointer-events:none;
}

@keyframes noise{
    0%{transform:translate(0,0);}
    25%{transform:translate(-1%,1%);}
    50%{transform:translate(1%,-1%);}
    75%{transform:translate(-1%,-1%);}
    100%{transform:translate(0,0);}
}

/* ================= EYES ================= */

.eyes{
    position:absolute;
    top:22%;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:150px;
    opacity:.25;
    z-index:-1;
    animation:blink 5s infinite;
}

.eye{
    width:18px;
    height:18px;
    background:var(--bloodGlow);
    border-radius:50%;
    box-shadow:
        0 0 10px var(--bloodGlow),
        0 0 30px var(--bloodGlow),
        0 0 60px var(--bloodGlow);
}

@keyframes blink{
    0%,92%,100%{
        transform:translateX(-50%) scaleY(1);
    }
    95%{
        transform:translateX(-50%) scaleY(.1);
    }
}

/* ================= NOTEBOOK ================= */

.notebook{
    position:relative;
    width:420px;
    height:590px;
    transform-style:preserve-3d;
    animation:floatBook 5s ease-in-out infinite;
}

@keyframes floatBook{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-8px);
    }
}

.page{
    position:absolute;
    top:0;
    left:0;

    width:100%;
    height:100%;

    transform-origin:left center;

    border-radius:2px 14px 14px 2px;

    overflow:hidden;

    transition:
        transform 1.4s cubic-bezier(.68,-0.55,.27,1.55),
        z-index .2s;

    backface-visibility:hidden;
}

/* ================= COVER ================= */

.cover{
    z-index:4;

    background:
        linear-gradient(145deg,#050505,#151515);

    border:2px solid #222;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    box-shadow:
        0 0 80px rgba(0,0,0,.9),
        inset 0 0 50px rgba(255,255,255,.03);

    position:absolute;
}

.cover::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);

    background-size:3px 3px;

    opacity:.3;

    pointer-events:none;
}

.cover h1{
    font-family:'UnifrakturCook', cursive;
    font-size:5rem;
    text-align:center;
    color:white;
    letter-spacing:8px;
    text-shadow:
        0 0 10px rgba(255,255,255,.15),
        0 0 30px rgba(255,255,255,.08);

    z-index:2;
}

.cover p{
    margin-top:10px;
    color:#666;
    letter-spacing:5px;
    font-size:11px;
    z-index:2;
}

.blood{
    position:absolute;
    width:220px;
    height:220px;
    top:-50px;
    right:-40px;
    background:
        radial-gradient(circle,
        rgba(139,0,0,.9) 0%,
        transparent 70%);
    filter:blur(18px);
}

/* ================= PAPER ================= */

.paper{
    background:
        linear-gradient(rgba(255,255,255,.08),
        rgba(0,0,0,.03)),
        var(--paper);

    padding:38px;

    display:flex;
    flex-direction:column;

    box-shadow:
        inset 0 0 50px rgba(0,0,0,.12);

    color:var(--ink);
}

.paper::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            transparent,
            transparent 27px,
            rgba(0,0,0,.15) 28px
        );

    opacity:.08;
    pointer-events:none;
}

.paper h2{
    font-family:'UnifrakturMaguntia', cursive;
    text-align:center;
    margin-bottom:24px;
    font-size:2rem;
    border-bottom:1px solid rgba(0,0,0,.2);
    padding-bottom:10px;
}

/* ================= RULES ================= */

.rules{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:18px;
    line-height:1.6;
    font-size:1.15rem;
}

/* ================= INPUTS ================= */

input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid rgba(0,0,0,.4);

    padding:12px 4px;

    margin-bottom:18px;

    outline:none;

    font-size:1.05rem;

    font-family:inherit;
}

input::placeholder{
    color:rgba(0,0,0,.5);
}

/* ================= BUTTON ================= */

.btn{
    border:1px solid var(--ink);

    background:transparent;

    padding:13px;

    font-family:'Cinzel', serif;

    letter-spacing:2px;

    cursor:pointer;

    transition:.35s;

    margin-top:auto;

    position:relative;
    z-index:10;
}

.btn:hover{
    background:var(--ink);
    color:var(--paper);

    transform:translateY(-2px);

    box-shadow:0 0 18px rgba(0,0,0,.35);
}

/* ================= FLIP ================= */

.flipped{
    transform:rotateY(-175deg);
    z-index:0 !important;
}

/* ================= REGISTRY ================= */

#registry{
    flex:1;
    overflow-y:auto;
    padding-right:5px;
}

.entry{
    padding:10px 0;
    border-bottom:1px dashed rgba(0,0,0,.2);
    animation:fade .4s ease;
}

.entry small{
    opacity:.6;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

#registry::-webkit-scrollbar{
    width:5px;
}

#registry::-webkit-scrollbar-thumb{
    background:#444;
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    .notebook{
        width:92vw;
        height:88vh;
    }

    .cover h1{
        font-size:3.7rem;
    }

    .paper{
        padding:24px;
    }

    .paper h2{
        font-size:1.7rem;
    }
}

</style>
</head>

<body>

<div class="eyes">
    <div class="eye"></div>
    <div class="eye"></div>
</div>

<div class="notebook" id="book">

    <!-- ================= PAGE 4 ================= -->

    <section class="page paper" id="page4" style="z-index:1;">

        <h2>The Registry</h2>

        <div id="registry"></div>

        <input
            type="text"
            id="victim"
            placeholder="Write a name..."
            maxlength="40"
        >

        <button class="btn" style="margin-bottom: 0px; font-size: 12px; padding: 5px 15px;" onclick="executeDeath()">
            EXECUTE
        </button> <br>
        <button class="btn" style="margin-bottom: 0px; font-size: 12px; padding: 5px 15px;" onclick="location.reload()">Return to Cover</button>
    </section>

    <!-- ================= PAGE 3 ================= -->

    <section class="page paper" id="page3" style="z-index:2;">

        <div id="auth"></div>

    </section>

    <!-- ================= PAGE 2 ================= -->

    <section class="page paper" id="page2" style="z-index:3;">

        <h2>The Rules</h2>

        <ul class="rules">

            <li>
                • The human whose name is written in this note shall die.
            </li>

            <li>
                • The writer must picture the victim's face.
            </li>

            <li>
                • If no cause is specified, death occurs by heart attack.
            </li>

            <li>
                • This notebook belongs to the Shinigami Realm.
            </li>

        </ul>

        <button class="btn" onclick="flipPage('page2')">
            I ACCEPT
        </button>

    </section>

    <!-- ================= PAGE 1 ================= -->

    <section class="page cover" id="page1">

        <div class="blood"></div>

        <h1>DEATH NOTE</h1>

        <p>PROPERTY OF THE SHINIGAMI</p>

        <button
            class="btn"
            style="
                margin-top:40px;
                color:var(--gold);
                border-color:var(--gold);
            "
            onclick="startRitual()"
        >
            BEGIN RITUAL
        </button>

    </section>

</div>

<script>

/* ================= STORAGE ================= */

const STORAGE = {
    password:"dn_password",
    security:"dn_security",
    names:"dn_names"
};

/* ================= AUDIO ================= */

const audioCtx = new(
    window.AudioContext ||
    window.webkitAudioContext
)();

function tone(freq,type="sine",volume=.05,duration=.3){

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

/* ================= AMBIENT ================= */

let ambientStarted = false;

function startAmbient(){

    if(ambientStarted) return;

    ambientStarted = true;

    const drone = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    drone.frequency.value = 40;
    drone.type = "sine";

    gain.gain.value = .015;

    drone.connect(gain);
    gain.connect(audioCtx.destination);

    drone.start();

    setInterval(()=>{

        tone(50,"sine",.05,.3);

        setTimeout(()=>{
            tone(45,"sine",.04,.3);
        },180);

    },1200);
}

/* ================= PAGE FLIP ================= */

function flipPage(id){

    tone(180,"triangle",.08,.5);

    document
        .getElementById(id)
        .classList
        .add("flipped");
}

/* ================= START ================= */

function startRitual(){

    audioCtx.resume();

    startAmbient();

    flipPage("page1");

    initAuth();
}

/* ================= AUTH UI ================= */

function initAuth(){

    const auth = document.getElementById("auth");

    const exists = localStorage.getItem(STORAGE.password);

    /* ================= CREATE ACCOUNT ================= */

    if(!exists){

        auth.innerHTML = `

            <h2>Binding Ritual</h2>

            <input
                id="newPass"
                type="password"
                placeholder="Master Password"
            >

            <input
                id="question"
                type="text"
                placeholder="Recovery Question"
            >

            <input
                id="answer"
                type="text"
                placeholder="Recovery Answer"
            >

            <button class="btn" onclick="saveAccount()">
                SEAL CONTRACT
            </button>
        `;
    }

    /* ================= LOGIN ================= */

    else{

        auth.innerHTML = `

            <div id="loginUI">

                <h2>Identity Verification</h2>

                <input
                    id="loginPass"
                    type="password"
                    placeholder="Enter Password"
                >

                <button class="btn" onclick="login()" style="text-align:center;">
                    ACCESS NOTE
                </button>

                <button
                    class="btn"
                    style="margin-top:12px; text-align:center;"
                    onclick="showForgotPage()"
                >
                    FORGOT PASSWORD
                </button>

            </div>

            <!-- RESET PAGE -->

            <div id="forgotUI" style="display:none;">

                <h2>Recovery Ritual</h2>

                <input
                    id="recoveryAnswer"
                    type="text"
                    placeholder=""
                >

                <input
                    id="newResetPass"
                    type="password"
                    placeholder="New Password"
                >

                <button class="btn" onclick="resetPassword()">
                    RESET PASSWORD
                </button>

                <button
                    class="btn"
                    style="margin-top:12px; text-align:center;"
                    onclick="backToLogin()"
                >
                    BACK
                </button>

            </div>
        `;
    }
}

/* ================= SAVE ACCOUNT ================= */

function saveAccount(){

    const pass = document
        .getElementById("newPass")
        .value
        .trim();

    const question = document
        .getElementById("question")
        .value
        .trim();

    const answer = document
        .getElementById("answer")
        .value
        .trim();

    if(pass.length < 4){

        alert("Password too short.");

        return;
    }

    localStorage.setItem(
        STORAGE.password,
        pass
    );

    localStorage.setItem(
        STORAGE.security,
        JSON.stringify({
            question,
            answer:answer.toLowerCase()
        })
    );

    tone(500,"triangle",.08,.4);

    initAuth();
}

/* ================= LOGIN ================= */

function login(){

    const pass = document
        .getElementById("loginPass")
        .value;

    if(pass === localStorage.getItem(STORAGE.password)){

        tone(600,"triangle",.06,.4);

        flipPage("page3");

        loadRegistry();

    }else{

        tone(90,"square",.12,.5);

        shakeBook();

        alert("The Shinigami rejects you.");
    }
}

/* ================= SHAKE ================= */

function shakeBook(){

    const book = document.getElementById("book");

    book.animate([
        {transform:"translateX(0)"},
        {transform:"translateX(-8px)"},
        {transform:"translateX(8px)"},
        {transform:"translateX(-8px)"},
        {transform:"translateX(0)"}
    ],{
        duration:400
    });
}

/* ================= FORGOT PAGE ================= */

function showForgotPage(){

    const data = JSON.parse(
        localStorage.getItem(STORAGE.security)
    );

    document.getElementById("loginUI").style.display = "none";

    document.getElementById("forgotUI").style.display = "block";

    document
        .getElementById("recoveryAnswer")
        .placeholder = data.question;
}

/* ================= BACK ================= */

function backToLogin(){

    document.getElementById("forgotUI").style.display = "none";

    document.getElementById("loginUI").style.display = "block";
}

/* ================= RESET PASSWORD ================= */

function resetPassword(){

    const data = JSON.parse(
        localStorage.getItem(STORAGE.security)
    );

    const answer = document
        .getElementById("recoveryAnswer")
        .value
        .trim()
        .toLowerCase();

    const newPass = document
        .getElementById("newResetPass")
        .value
        .trim();

    if(answer !== data.answer){

        tone(80,"square",.1,.5);

        alert("Wrong recovery answer.");

        return;
    }

    if(newPass.length < 4){

        alert("Password too short.");

        return;
    }

    localStorage.setItem(
        STORAGE.password,
        newPass
    );

    tone(500,"triangle",.08,.4);

    alert("Password reset successful.");

    backToLogin();
}

/* ================= EXECUTE ================= */

function executeDeath(){

    const input = document.getElementById("victim");

    const name = input.value.trim();

    if(!name) return;

    tone(800,"sawtooth",.03,.1);

    setTimeout(()=>{
        tone(650,"sawtooth",.03,.1);
    },100);

    const names = JSON.parse(
        localStorage.getItem(STORAGE.names) || "[]"
    );

    names.unshift({
        name,
        time:new Date().toLocaleString()
    });

    localStorage.setItem(
        STORAGE.names,
        JSON.stringify(names)
    );

    input.value = "";

    loadRegistry();
}

/* ================= LOAD REGISTRY ================= */

function loadRegistry(){

    const registry = document.getElementById("registry");

    const names = JSON.parse(
        localStorage.getItem(STORAGE.names) || "[]"
    );

    if(names.length === 0){

        registry.innerHTML = `
            <p style="
                text-align:center;
                margin-top:40px;
                opacity:.5;
            ">
                No names written yet...
            </p>
        `;

        return;
    }

    registry.innerHTML = names.map(item => `
        <div class="entry">
            • ${item.name}<br>
            <small>${item.time}</small>
        </div>
    `).join("");
}

</script>

</body>
</html>
